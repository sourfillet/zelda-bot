[project]
name = "zelda-bot"
version = "0.1.0"
description = "Reinforcement learning agents that play NES games via stable-retro"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    # [and-cuda] pulls the 12 nvidia-* wheels that requirements.txt listed by hand
    "tensorflow[and-cuda]==2.18.0",
    "stable-retro==0.9.3",
    "gymnasium==1.0.0",
    "opencv-python==4.11.0.86",
    "numpy==2.0.2",
    "h5py==3.15.1",
]

[dependency-groups]
dev = [
    "ruff==0.16.1",
    "mypy==2.3.0",
    "matplotlib>=3.11.1",
    "pandas>=2.3.3",
    "jupyterlab>=4.6.2",
]

[tool.uv]
# This is an application, not a library — nothing imports zelda-bot, so uv
# manages the environment without building or installing the project itself.
package = false

# Held at the versions this CUDA/TensorFlow environment was verified against.
# Neither is a direct dependency -- TF pulls them -- but both can change model
# behaviour, so a tooling migration should not move them silently. Lift with
# `uv lock --upgrade` as a deliberate, separately verified change.
constraint-dependencies = [
    "keras==3.13.0",
    "wrapt==1.17.2",
]

[tool.ruff]
line-length = 110
target-version = "py311"
# archive/ is the pre-gym-retro Nintaco backend, kept for reference only.
# zelda_env/ and .venv/ are virtualenvs that happen to live in the tree.
exclude = ["archive", "zelda_env", ".venv", "saved_models", "recordings", "runs", "ram_dumps"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes: undefined names, unused imports/variables
    "I",    # isort: import ordering
    "B",    # flake8-bugbear: likely bugs
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade: outdated syntax for the target version
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "NPY",  # numpy-specific rules (legacy random, deprecated aliases)
]
ignore = [
    "E501",    # line length: handled by the formatter, not worth churning docstrings over
    "NPY002",  # legacy np.random.* -> Generator. Migrating would change the RNG
               # stream and therefore every training run's trajectory, so it is a
               # behavioural change, not a lint fix. Left for a deliberate PR.
]

[tool.ruff.lint.per-file-ignores]
# Reward/RAM tables read better aligned in columns than reflowed.
"games/Zelda/adapter.py" = ["E241"]

[tool.mypy]
python_version = "3.11"
files = ["main.py", "games", "models", "scripts"]
exclude = "(archive|zelda_env|\\.venv)/"
# The repo root has a vestigial empty __init__.py, which otherwise makes mypy
# read the root as a package literally named "zelda-bot" and refuse to run.
# Treating the root as the package base makes main.py a top-level module.
explicit_package_bases = true
mypy_path = "."

# Every function in the project is annotated, so require it of new ones too --
# otherwise coverage silently rots back. Third-party calls still return Any
# (no stubs for retro/tf/cv2), which is why the disallow_any_* knobs stay off.
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
show_error_codes = true

# Neither stable-retro, TensorFlow, OpenCV nor Keras ship usable stubs.
[[tool.mypy.overrides]]
module = ["retro.*", "tensorflow.*", "keras.*", "cv2.*"]
ignore_missing_imports = true
